# Impostazioni del progetto PALESTRA su Supabase. Si applicano con
#   npx supabase config diff        (prima: mostra cosa cambierebbe)
#   npx supabase config push --yes  (cambia SOLO quello che questo file dichiara: SMTP e il resto restano come sono)
# L'integrazione GitHub di Supabase applica le migrazioni in migrations/ a ogni push su main.
project_id = "palestra"

[auth]
site_url = "https://luigi-00-tt.github.io/palestra/"
additional_redirect_urls = ["https://luigi-00-tt.github.io/palestra/"]
# 19/11/2026: password più robuste. Valgono quando si crea o si cambia la password; le vecchie restano valide.
# L'app controlla anche l'elenco delle password più comuni e che non contenga nome utente o email (cloud.js).
minimum_password_length = 10
password_requirements = "letters_digits"

# 19/11/2026: limiti più alti, gratuiti. Gli accessi con lo username passano tutti dalla funzione «account»,
# quindi arrivano dallo stesso IP: il limite per IP deve bastare per tutti insieme.
[auth.rate_limit]
sign_in_sign_ups = 300   # per 5 minuti (era 30)
token_refresh = 300      # per 5 minuti (era 150)
email_sent = 100         # all'ora; Gmail ne permette circa 500 al giorno

[auth.email]
enable_confirmations = true      # 19/11/2026: l'account si usa dopo aver confermato l'email
double_confirm_changes = false   # i vecchi account hanno un'email finta che non riceve posta: si conferma solo la nuova

[auth.email.template.confirmation]
subject = "Conferma la tua email per Palestra"
content_path = "./supabase/templates/conferma.html"

[auth.email.template.recovery]
subject = "Nuova password per Palestra"
content_path = "./supabase/templates/recupero.html"

[auth.email.template.email_change]
subject = "Conferma la tua email per Palestra"
content_path = "./supabase/templates/cambio-email.html"

[functions.account]
verify_jwt = false

[functions.promemoria]
verify_jwt = false
